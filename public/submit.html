<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarDraft | Submit Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Solar<span>Draft</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="gallery.html">Drafting Gallery</a>
            <a href="pricing.html">Subscription Plans</a>
            <a href="submit.html" class="active btn-nav">+ Submit Project</a>
        </div>
    </header>

    <div class="container" style="margin-top: 30px; max-width: 650px;">
        <div class="card-panel">
            <h2 class="section-title">Submit Solar Project Request</h2>
            <p class="section-sub">Enter site details below. Our team will start drafting immediately.</p>

            <form id="solarProjectForm">
                <div class="form-group">
                    <label>Client / Company Name</label>
                    <input type="text" id="clientName" required placeholder="e.g. Apex Solar Contractors">
                </div>

                <div class="form-group">
                    <label>Site Location / GPS Address</label>
                    <input type="text" id="siteAddress" required placeholder="123 Solar Way, Austin, TX">
                </div>

                <div class="form-group">
                    <label>Preferred Software Tool</label>
                    <select id="preferredSoftware">
                        <option value="Aurora Solar">Aurora Solar</option>
                        <option value="Solargraf">Solargraf</option>
                        <option value="AutoCAD + PVSyst">AutoCAD + PVSyst (Permit Set)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Module / Inverter / Panel Specs & Notes</label>
                    <textarea id="projectNotes" rows="4" placeholder="Specify module wattage, inverter model, or roof tilt preferences..."></textarea>
                </div>

                <button type="submit" class="btn-secondary" style="width:100%; cursor:pointer;">Submit to Design Queue</button>
            </form>
            <div id="responseMessage" style="margin-top: 15px; font-weight: bold; font-size: 14px;"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SolarDraft Agency. All Rights Reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
